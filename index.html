<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G HUB Fault diagnosis</title>
<style>
@font-face{font-family:PF;src:local("PingFang SC Light"),local("PingFangSC-Light");font-weight:300}
@font-face{font-family:PF;src:local("PingFang SC Regular"),local("PingFangSC-Regular");font-weight:400}
@font-face{font-family:PF;src:local("PingFang SC Medium"),local("PingFangSC-Medium");font-weight:500}
@font-face{font-family:PF;src:local("PingFang SC Semibold"),local("PingFangSC-Semibold");font-weight:600 700}
:root{
  --bg:#000; --panel:#1e1f22; --field:#2a2b2f; --field-h:#323439; --line:#2f3136;
  --text:#fff; --sub:#a3a5aa; --dim:#6b6e74;
  --blue:#1199ff; --red:#ff4545; --green:#3ddc84; --amber:#ffb020;
  --t-h1:34px; --t-h2:24px; --t-h3:24px; --t-sec:15px; --t-body:14px; --t-cap:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:PF,"PingFang SC","Microsoft YaHei UI",sans-serif;-webkit-font-smoothing:antialiased}
b,strong{font-weight:600}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
#c{position:fixed;inset:0;display:block;z-index:1;cursor:grab;touch-action:none}

/* ---------- G HUB chrome ---------- */
.title{position:fixed;left:112px;top:46px;font-size:var(--t-h1);font-weight:600;letter-spacing:.5px;z-index:5}
.back{position:fixed;left:32px;top:48px;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;z-index:5;transition:background .2s}
.back:hover,.gear:hover{background:var(--field)}
.back svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rail{position:fixed;left:24px;top:136px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:5}
.rail button{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;color:#9a9da3;transition:color .2s,background .2s}
.rail button:not(.on):hover{color:#fff;background:var(--panel)}
.rail button.on{background:#6690ff;color:#fff}
.rail svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail button.on svg{width:34px;height:34px;stroke-width:2}
.gear{position:fixed;left:32px;bottom:32px;width:40px;height:40px;border-radius:8px;background:#0b0b0d;border:1px solid #1c1d21;display:grid;place-items:center;color:#fff;z-index:5;transition:background .2s}
.gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- panel (left, next to the rail) ---------- */
.panel{position:fixed;top:136px;bottom:32px;left:112px;width:440px;background:var(--panel);border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.045);display:flex;flex-direction:column;z-index:5}
.ph{padding:28px 32px 0}
.ph h2{font-size:var(--t-h2);font-weight:600}
.tabs{display:flex;gap:28px;margin-top:20px;font-size:var(--t-sec);color:var(--sub);border-bottom:1px solid var(--line);position:relative}
.tabs button{padding-bottom:10px;transition:color .2s;position:relative}
.tabs button:hover,.tabs button.on{color:#fff}
.tabs button.on{font-weight:500}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:#fff}
.tabs .cnt{position:absolute;top:-4px;right:-16px;min-width:16px;height:16px;border-radius:8px;background:var(--blue);color:#fff;font-size:10px;font-weight:600;display:none;place-items:center;padding:0 4px}
.tabs .cnt.show{display:grid}
.pb{flex:1;padding:24px 32px 0;overflow:auto;display:flex;flex-direction:column}
.pb>*{flex:none}
.pb>.hero{flex:1}
.pb::-webkit-scrollbar{width:6px}.pb::-webkit-scrollbar-thumb{background:#3a3c41;border-radius:3px}
.pf{padding:20px 32px 32px}
.pf:empty{display:none}

/* phase tracker */
.phase{display:flex;gap:6px;margin-bottom:22px}
.phase div{flex:1}
.phase i{display:block;height:3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.phase i::after{content:"";position:absolute;inset:0;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.6,0,.2,1)}
.phase span{display:block;font-size:var(--t-cap);color:var(--dim);margin-top:8px}
.phase .done i::after{transform:scaleX(1);background:var(--sub)} .phase .done span{color:var(--sub)}
.phase .cur i::after{transform:scaleX(1)} .phase .cur span{color:#fff;font-weight:500}

.eyebrow{font-size:var(--t-cap);color:var(--sub);letter-spacing:.5px}
.eyebrow b{color:var(--blue);font-weight:500}
.h{font-size:var(--t-h3);font-weight:600;line-height:1.35;margin-top:8px;text-wrap:balance}
.desc{font-size:var(--t-body);color:var(--sub);line-height:1.7;margin-top:8px}
.sec{font-size:var(--t-cap);color:var(--sub);margin-top:24px;letter-spacing:.5px}
.red{color:var(--red)} .blue{color:var(--blue)} .green{color:var(--green)}

.rows{margin-top:10px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);font-size:var(--t-body)}
.row>span:first-child{color:var(--sub)}
.row>span:last-child,.row>b:last-child{text-align:right}

/* choices */
.choices{margin-top:10px;border-top:1px solid var(--line)}
.ch{text-align:left;display:flex;align-items:center;gap:14px;padding:14px 8px;margin:0 -8px;width:calc(100% + 16px);border-bottom:1px solid var(--line);border-radius:4px;transition:background .2s}
.ch:hover{background:rgba(255,255,255,.035)}
.ch .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--dim);flex:none;transition:border .2s}
.ch.sel .rd{border:5px solid var(--blue)}
.ch .tx{flex:1}
.ch .tx div{font-size:var(--t-body)}
.ch .tx small{display:block;font-size:var(--t-cap);color:var(--dim);margin-top:4px}
.ch.sel .tx div{font-weight:500}
.ch .cv{color:var(--dim);font-size:16px}

/* checklist */
.ck{width:calc(100% + 16px);margin:0 -8px;padding:13px 8px;text-align:left;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);border-radius:4px;transition:background .2s}
.ck:hover{background:rgba(255,255,255,.035)}
.ck .bx{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--dim);flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;color:transparent;transition:all .2s}
.ck.on .bx{background:var(--blue);border-color:var(--blue);color:#fff}
.ck div{font-size:var(--t-body)} .ck small{display:block;font-size:var(--t-cap);color:var(--dim);margin-top:4px}

/* scan header: anime.js ring + counter */
.scanhead{display:flex;align-items:center;gap:18px;position:relative}
.scanhead .ring{width:80px;height:80px;transform:rotate(-90deg);flex:none}
.scanhead .ring circle{fill:none;stroke-width:3}
.scanhead .ring .bg{stroke:var(--line)}
.scanhead .ring .fg{stroke:var(--blue);stroke-linecap:round;transition:stroke .3s}
.scanhead .ring .fg.bad{stroke:var(--red)}
.scanhead .num{position:absolute;left:0;top:0;width:80px;height:80px;display:flex;align-items:center;justify-content:center;gap:1px}
.scanhead .num b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.scanhead .num span{font-size:11px;color:var(--sub);margin-top:6px}
.st{transition:color .2s}
.st.now{color:#fff;font-weight:500}
/* start hero */
.hero{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:8px}
.hero .h{margin-top:32px;font-size:26px;letter-spacing:.5px}
.conn{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:var(--t-body);color:var(--sub)}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.idle{width:132px;height:132px}
.idle circle,.idle path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.idle .t{stroke:var(--line);stroke-width:1.5;stroke-dasharray:2 6;transform-origin:60px 60px}
.idle .b{stroke:var(--field-h);stroke-width:1.5}
.idle .w{stroke:var(--blue);stroke-width:2.5}
/* repair-complete celebration */
.yay{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px}
.yay .badge{width:84px;height:84px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(61,220,132,.15)}
.yay .badge svg{width:42px;height:42px;fill:none;stroke:#06210f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.yay .cf,.medal .cf{position:absolute;width:7px;height:10px;border-radius:2px;margin:-5px 0 0 -3px;pointer-events:none}
/* status list */
.st{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--t-body)}
.st .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;font-weight:600}
.st .ok{background:var(--sub);color:#000}
.st .bad{background:var(--red);color:#fff}
.st .run{border:2px solid var(--blue);border-top-color:transparent;animation:spin .7s linear infinite}
.st .wait{border:1.5px solid var(--dim)}
.st em{margin-left:auto;white-space:nowrap;padding-left:12px;font-style:normal;font-size:var(--t-cap);color:var(--sub)}
@keyframes spin{to{transform:rotate(360deg)}}
.st .na{border:1.5px dashed var(--dim)}
/* wheel & base map: one cell per part of the model */
.pmc{background:var(--field);border-radius:8px;padding:14px 16px;margin-top:10px}
.pmc .t{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--t-body);font-weight:500}
.pmc .t span{font-size:var(--t-cap);color:var(--sub);font-weight:400}
.cells{display:flex;gap:4px;margin-top:12px}
.cell{flex:1;height:22px;border-radius:3px;background:#3a3c41;transition:background .3s,box-shadow .3s,transform .2s;cursor:pointer}
.cell:hover{transform:translateY(-2px)}
.cell.ok{background:#4c8f6b}.cell.bad{background:var(--red)}
.cell.run{background:var(--blue);box-shadow:0 0 0 3px rgba(17,153,255,.22)}
.cell.na{background:repeating-linear-gradient(-45deg,#3a3c41 0 3px,var(--field) 3px 6px)}
.pmc .lbl{font-size:var(--t-cap);color:var(--sub);margin-top:9px;line-height:1.55}
.pmleg{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:12px}
.pmleg span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.pmtick{margin-top:14px;font-size:var(--t-body);line-height:1.9;color:var(--dim)}
.pmtick .now{color:var(--blue)}
.st.more{cursor:pointer}.st.more:hover em{color:#fff}
.pmlist{font-size:var(--t-cap);color:var(--sub);line-height:1.7;padding:10px 0 12px 30px;border-bottom:1px solid var(--line);display:none}
.pmlist.open{display:block}

.img{height:168px;border-radius:6px;margin-top:16px;border:1px dashed #44474d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);font-size:var(--t-cap);text-align:center;padding:10px}
.pic{margin-top:16px;border-radius:6px;border:1px solid var(--line);padding:14px 12px;background:#0b0b0d}
.pic img{display:block;width:100%;filter:invert(1) brightness(.92);mix-blend-mode:screen}
.img svg{width:26px;height:26px;stroke:#55585e;fill:none;stroke-width:1.5}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tools span{font-size:var(--t-cap);background:var(--field);color:var(--sub);padding:5px 9px;border-radius:4px}

.partcard{display:flex;align-items:center;gap:16px;background:var(--field);border-radius:6px;padding:16px;margin-top:14px}
.partcard .ring{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--red);display:grid;place-items:center;flex:none}
.partcard .ring i{width:14px;height:14px;border-radius:50%;background:var(--red)}
.partcard b{font-size:17px}
.partcard small{display:block;font-size:var(--t-cap);color:var(--sub);margin-top:3px}
.partcard .tag{margin-left:auto;white-space:nowrap;flex:none;font-size:var(--t-cap);color:var(--red);background:rgba(255,69,69,.14);padding:3px 8px;border-radius:4px}

.fb{margin-top:14px;font-size:var(--t-cap);line-height:1.6;display:none}
.fb.show{display:block}
.fb.good{color:var(--green)} .fb.info{color:var(--amber)}

/* buttons — plain, like G HUB */
.btn{width:100%;height:48px;border-radius:6px;background:var(--blue);display:flex;align-items:center;justify-content:center;gap:8px;font-size:var(--t-sec);font-weight:600;transition:background .2s,transform .1s}
.btn:hover{background:#2aa5ff}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:var(--field);color:var(--dim);cursor:not-allowed}
.btn.ok{background:var(--green);color:#06210f}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24;display:none}
.btn.ok svg{display:block;animation:draw .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.btn2{width:100%;height:48px;border-radius:6px;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:var(--t-sec);margin-top:10px;transition:background .2s}
.btn2:hover{background:var(--field-h)}
/* medals: flat sticker medals, the unlock screen and the My garage tab */
.btn.go{background:var(--green);color:#06210f}.btn.go:hover{background:#56e596}
.btn.sub{background:var(--field);color:#fff;height:40px;font-weight:500;font-size:var(--t-body);margin-top:8px}.btn.sub:hover{background:var(--field-h)}
.stk{display:block;overflow:visible}
.stk .tx{font-family:Bahnschrift,"DIN Alternate","Arial Narrow",sans-serif;font-weight:700;font-stretch:75%}
.medal{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.medal .glow{position:relative;width:170px;height:170px;display:grid;place-items:center}
.medal .glow:before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(rgba(61,220,132,.2),transparent 68%)}
.medal .tag{margin-top:14px;background:rgba(61,220,132,.12);color:var(--green);font-size:var(--t-cap);font-weight:500;padding:4px 10px;border-radius:12px}
.medal .h{margin-top:10px}.medal .desc{margin-top:4px}
.medal .wall{display:flex;align-items:center;gap:10px;margin-top:26px;font-size:var(--t-cap);color:var(--sub)}
.medal .wall>span{display:flex;align-items:center;gap:4px}
.medal .slot{width:28px;height:28px;display:grid;place-items:center}
.medal .slot i{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--green)}
.gstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gstat{background:var(--field);border-radius:8px;padding:12px 14px}
.gstat b{display:block;font-size:22px;font-weight:600;line-height:1.1}
.gstat b small{font-size:14px;color:var(--dim)}
.gstat span{font-size:var(--t-cap);color:var(--sub)}
.gsec{font-size:var(--t-sec);font-weight:500;display:flex;justify-content:space-between;align-items:baseline;margin-top:24px}
.gsec small{font-size:var(--t-cap);color:var(--sub);font-weight:400}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin-top:14px}
.mcell{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--sub);text-align:center}
.mcell.lock{color:var(--dim)}
.mcell .pop{display:block;transition:transform .25s}
.mcell:not(.lock):hover .pop{transform:translateY(-3px) scale(1.06)}
.glog{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.glog .t{flex:1}.glog .t div:last-child{font-size:var(--t-cap);color:var(--sub);margin-top:2px}
.glog .d{font-size:var(--t-cap);color:var(--dim)}
.glog.fresh{animation:fresh 2.4s ease-out .4s both;border-radius:6px}
.mcell.fresh{color:var(--green)}
@keyframes fresh{0%{background:rgba(61,220,132,.16);box-shadow:-10px 0 0 rgba(61,220,132,.16),10px 0 0 rgba(61,220,132,.16)}100%{background:transparent;box-shadow:-10px 0 0 transparent,10px 0 0 transparent}}
.note{text-align:center;margin-top:12px;font-size:var(--t-cap);color:var(--dim)}
.note button{color:var(--blue);font-size:var(--t-cap)}
.note button:hover{text-decoration:underline}
.meter{display:flex;gap:4px;height:46px;align-items:flex-end;margin-top:16px}
.meter i{flex:1;background:var(--field);border-radius:2px;height:12%;transition:height .25s,background .25s}
.meter i.on{background:var(--green)}

/* store */
.item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item .th{width:64px;height:64px;border-radius:6px;border:1px dashed #44474d;flex:none}
.item .nm{font-size:var(--t-body);font-weight:500}
.item small{display:block;font-size:var(--t-cap);color:var(--dim);margin-top:3px}
.item .pr{margin-left:auto;text-align:right;font-size:var(--t-body);white-space:nowrap}
.item .add{margin-top:10px;font-size:var(--t-cap);color:var(--blue)}
.item .add.in{color:var(--green)}
.need{font-size:11px;color:var(--red);background:rgba(255,69,69,.14);padding:2px 6px;border-radius:3px;margin-left:6px;font-weight:400}

/* ---------- 3D overlays: G HUB style callouts ---------- */
.co{position:fixed;left:0;top:0;width:0;height:0;z-index:4;pointer-events:none}
.co .dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--c)}
.co.pulse .dot{animation:ping 1.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--c)}100%{box-shadow:0 0 0 16px transparent}}
.co svg{position:absolute;left:0;top:0;overflow:visible}
.co polyline{fill:none;stroke:var(--c);stroke-width:1}
.co .lab{position:absolute;white-space:nowrap;font-size:15px;font-weight:600;color:var(--c);background:rgba(0,0,0,.62);padding:3px 10px;border-radius:4px;margin:-3px 0 0 -10px}
#tip{position:fixed;pointer-events:none;z-index:20;background:rgba(30,31,34,.96);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:var(--t-cap);min-width:200px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
#tip.show{opacity:1;transform:none}
#tip b{display:block;font-size:var(--t-sec);margin-bottom:6px}
#tip .r{display:flex;justify-content:space-between;gap:16px;color:var(--sub);margin-top:4px}
.toast{position:fixed;left:calc(50% + 276px);top:60px;transform:translate(-50%,-10px);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:6px;font-size:var(--t-body);z-index:40;opacity:0;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{position:fixed;left:150px;bottom:30px;font-size:var(--t-cap);color:var(--dim);z-index:5}
.loading{position:fixed;left:calc(50% + 276px);top:50%;transform:translate(-50%,-50%);font-size:var(--t-body);color:var(--dim);z-index:4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="loading" id="loading">Loading model…</div>

<button class="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></button>
<div class="title">G923</div>
<div class="rail">
  <button aria-label="Add device" title="Add device"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M12 8.5v7M8.5 12h7"/></svg></button>
  <button class="on" aria-label="Wheel" aria-current="page" title="Wheel"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 11.2h16.4M12 13.6v6.8"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></button>
</div>

new GLTFLoader().parse(b64buf(window.WHEEL_BASE_GLB), '', gltf=>{
  gltf.scene.updateMatrixWorld(true);
  const src = []; gltf.scene.traverse(o=>{ if(o.isMesh) src.push(o); });
  // the wheel axis frame sits on the centre of the hub disc
  const hub = src.find(o=>o.name==='p71'), hb = new THREE.Box3().setFromObject(hub);
  axisFrame.position.copy(hb.getCenter(new THREE.Vector3()));
  axisFrame.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), WHEEL_AXIS);
  axisFrame.updateMatrixWorld(true);
  const toAxis = axisFrame.matrixWorld.clone().invert();
  const baseGeo = {};
  src.forEach(o=>{
    const id = o.name.slice(1), [part, mk] = MAP[id] || ['motors','inner'];
    if(BASE_PARTS.has(part)){ const k = part+'|'+mk; (baseGeo[k] = baseGeo[k] || []).push(bakeGeometry(o)); return; }
    const m = new THREE.Mesh(bakeGeometry(o, toAxis), makeMat(mk));
    m.name = o.name; m.castShadow = m.receiveShadow = true;
    m.userData.part = part; m.userData.e0 = m.material.emissive.clone(); m.userData.i0 = m.material.emissiveIntensity;
    m.userData.bloom = BLACK;   // white model: nothing glows
    if(part === 'contact'){ m.material.transparent = true; collar = m; }   // only the contact ring fades in the repair animation
    (part === 'qr' || part === 'contact' ? qr : body).add(m);
    meshes.push(m);
  });
  // the base never highlights on its own, so its parts are merged per material (fewer draw calls)
  Object.entries(baseGeo).forEach(([k, list])=>{
    const [part, mk] = k.split('|');
    const geo = mergeGeometries(list.map(g=>{ g.deleteAttribute('uv'); return g; }));
    const mat = makeMat(mk); if(mat.userData.glass) baseMats.push(mat);
    const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = !mat.userData.glass; m.renderOrder = mat.userData.glass ? 2 : 0;
    m.userData.part = part; m.userData.glass = !!mat.userData.glass; m.userData.e0 = mat.emissive.clone(); m.userData.i0 = mat.emissiveIntensity; m.userData.bloom = BLACK;
    base.add(m); meshes.push(m);
  });
  // mirror copies share the geometry, follow the source mesh every frame
  meshes.forEach(src=>{ const c = new THREE.Mesh(src.geometry, mirrorMat); c.matrixAutoUpdate = false; c.userData.src = src; mirrorRoot.add(c); mirrors.push(c); });
  $('#loading').remove();
  view('front', 1.8);
  gsap.from(product.rotation,{y:-.5,duration:1.8,ease:'power3.out'});
  modelReady();
}, err=>{ $('#loading').textContent = 'Model failed to load'; console.error(err); });
/* x-ray: the base turns see-through when the camera needs to look at the quick release inside it */
const XR = {v:SHELL_OPACITY};
function xray(on, d=1){
  gsap.to(XR, {v:on ? .07 : SHELL_OPACITY, duration:d*.8, ease:'power2.inOut', onUpdate:()=>baseMats.forEach(m=>{ m.opacity = XR.v; })});
}
const partCenter = part => {
  const b = new THREE.Box3();
  meshes.filter(o=>o.userData.part===part).forEach(o=>{ o.geometry.computeBoundingBox(); b.union(o.geometry.boundingBox); });
  if(b.isEmpty()) return new THREE.Vector3();
  const c = b.getCenter(new THREE.Vector3()); c.y = b.max.y;   // anchor on the top edge so the dot sits on the part, not inside it
  return c;   // in the wheel axis frame (before rig offsets)
};

/* highlight states: hover / selected (blue), cue (blue pulse), fault (red pulse), fixed (green) */
let hoverPart = null, selPart = null, cuePart = null, faultPart = null, fixedPart = null;
const okParts = new Set(), OKG = {v:0};   // power-on test: parts confirmed good glow green (strength OKG.v)
const C = {blue:new THREE.Color(0x1199ff), red:new THREE.Color(0xff2a2a), green:new THREE.Color(0x3ddc84)};
function stateOf(p, pulse){
  if(okParts.has(p) && OKG.v > .001) return [C.green, OKG.v];
  if(p===faultPart) return [C.red, .25 + .55*pulse];
  if(p===fixedPart) return [C.green, .35];
  if(p===cuePart)   return [C.blue, .1 + .3*pulse];
  if(p===hoverPart) return [C.blue, .4];
  if(p===selPart)   return [C.blue, .28];
  return null;
}
function paint(t){
  const pulse = .5 + .5*Math.sin(t*5);
  meshes.forEach(o=>{
    const st = stateOf(o.userData.part, pulse), m = o.material;
    if(st){ m.emissive.copy(st[0]); m.emissiveIntensity = st[1]; }
    else { m.emissive.copy(o.userData.e0); m.emissiveIntensity = o.userData.i0; }
  });
}

/* =========================================================
   CALLOUTS — G HUB style dot + leader anchored to a part (line drawn with anime.js)
   ========================================================= */
const callouts = [];
function callout(part, text, color, dx, dy, pulse=true){
  const el = document.createElement('div');
  el.className = 'co' + (pulse?' pulse':''); el.style.setProperty('--c', color);
  const ex = dx*.35;
  const side = dx < 0 ? `right:${-dx}px` : `left:${dx}px`;
  el.innerHTML = `<div class="dot"></div><svg width="1" height="1"><polyline points="0,0 ${ex},${dy} ${dx},${dy}"/></svg><div class="lab" style="${side};top:${dy-26}px">${text}</div>`;
  document.body.appendChild(el);
  const holder = part==='qr'||part==='contact' ? qr : body;
  callouts.push({el, pt:partCenter(part), holder});
  anime({targets:el.querySelector('polyline'), strokeDashoffset:[anime.setDashoffset,0], duration:700, easing:'easeOutQuart'});
  anime({targets:el.querySelector('.lab'), opacity:[0,1], translateY:[6,0], delay:350, duration:450, easing:'easeOutQuart'});
  anime({targets:el.querySelector('.dot'), scale:[0,1], duration:400, easing:'easeOutBack'});
}
function clearCallouts(){ callouts.splice(0).forEach(c=>c.el.remove()); }
const v3 = new THREE.Vector3();
function placeCallouts(){
  callouts.forEach(c=>{
    v3.copy(c.pt).applyMatrix4(c.holder.matrixWorld).project(camera);
    c.el.style.transform = `translate(${(v3.x*.5+.5)*innerWidth}px,${(-v3.y*.5+.5)*innerHeight}px)`;
  });
}

/* =========================================================
   HOVER
   ========================================================= */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('#tip');
let diagnosedOnce = false;
function pick(e){
  mouse.x = e.clientX/innerWidth*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  // the base housing is see-through: parts inside it win, the housing itself answers only where nothing is behind it
  const hits = ray.intersectObjects(meshes.filter(m=>m.visible && (m.userData.glass || m.material.opacity>.3)), false);
  const solid = hits.find(h=>!h.object.userData.glass), glass = hits.find(h=>h.object.userData.glass);
  return (solid || glass) ? (solid || glass).object.userData.part : null;
}
function showTip(part, e){
  const p = PARTS[part];
  const st = part===faultPart ? ['● Poor contact','var(--red)']
           : part===fixedPart ? ['● Replaced','var(--green)']
           : !diagnosedOnce ? ['Not checked','var(--dim)']
           : !READABLE.has(part) ? ['No signal · check visually','var(--dim)'] : ['● Normal','var(--green)'];
  tip.innerHTML = `<b>${p.n}</b>
    <div class="r"><span>Location</span><span>${p.z}</span></div>
    <div class="r"><span>Repair method</span><span style="color:${p.u?'var(--blue)':'var(--sub)'}">${p.u?'Self-replaceable':'Service centre'}</span></div>
    <div class="r"><span>Status</span><span style="color:${st[1]}">${st[0]}</span></div>`;
  tip.style.left = (e.clientX+18)+'px'; tip.style.top = (e.clientY+18)+'px'; tip.classList.add('show');
}
let down = null, dragging = false;
canvas.addEventListener('pointerdown', e=>{ down = {x:e.clientX, y:e.clientY}; dragging = false; });
canvas.addEventListener('pointermove', e=>{
  if(down && Math.hypot(e.clientX-down.x, e.clientY-down.y) > 4){ dragging = true; hoverPart = null; tip.classList.remove('show'); canvas.style.cursor = 'grabbing'; }
  if(down) return;
  hoverPart = pick(e);
  canvas.style.cursor = hoverPart ? 'pointer' : 'grab';
  if(hoverPart) showTip(hoverPart, e); else tip.classList.remove('show');
});
addEventListener('pointerup', e=>{
  const wasDown = down, wasDrag = dragging; down = null; dragging = false;
  if(!wasDown || e.target !== canvas) return;
  canvas.style.cursor = 'grab';
  if(wasDrag || e.button !== 0) return;
  // click: select a part and bring it to the camera; click on empty space to deselect
  const part = pick(e);
  selPart = part && part !== 'body' ? part : null;
  if(selPart) focusPart(selPart);
});
canvas.addEventListener('dblclick', ()=>{ selPart = null; view('front', 1); });   // double-click: reset the view
canvas.addEventListener('pointerleave', ()=>{ hoverPart=null; tip.classList.remove('show'); });
function focusPart(part){
  const c = partCenter(part).clone(); rig.localToWorld(c);
  const backSide = part==='paddles' || part==='qr' || part==='contact';
  const dir = new THREE.Vector3(backSide ? .35 : -.2, .22, backSide ? -1 : 1).normalize().multiplyScalar(.5);
  gsap.to(camera.position,{x:c.x+dir.x, y:c.y+dir.y, z:c.z+dir.z, duration:1, ease:'power3.inOut'});
  gsap.to(controls.target,{x:c.x*.6, y:c.y*.6, z:c.z*.6, duration:1, ease:'power3.inOut'});
}

const clock = new THREE.Clock();
gsap.fromTo(SCAN_U.uSweep, {value:-.3}, {value:.3, duration:2.8, ease:'sine.inOut', repeat:-1, repeatDelay:4.5, delay:3});   // light sweep
(function loop(){
  requestAnimationFrame(loop);
  paint(clock.getElapsedTime());
  controls.update();
  // pass 1: emissive parts only -> bloom.  pass 2: full scene + gradient background, bloom, vignette, grain
  product.updateMatrixWorld(true);
  mirrors.forEach(c=>{ c.matrix.multiplyMatrices(FLIP, c.userData.src.matrixWorld); c.visible = c.userData.src.visible; });
  floor.visible = mirrorRoot.visible = false;
  meshes.forEach(o=>{ o.userData.mat = o.material; o.material = o.userData.bloom; });   // only the LEDs stay lit
  bloomComposer.render();
  meshes.forEach(o=>{ o.material = o.userData.mat; });
  floor.visible = true; mirrorRoot.visible = camera.position.y > FLOOR_Y + .03;
  renderer.shadowMap.needsUpdate = true;
  finalPass.uniforms.uTime.value = clock.getElapsedTime();
  composer.render();
  placeCallouts();
})();

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }

const PIC = (src, alt) => `<div class="pic"><img src="${src}" alt="${alt}"></div>`;
const IMG = t => `<div class="img"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>Image: ${t}</div>`;
const CHECK = `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
function choose(container, onPick){
  container.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
    container.querySelectorAll('.ch').forEach(x=>x.classList.toggle('sel', x===b)); onPick(b.dataset.k);

function feedback(cls, html){ const f=$('#fb'); f.className='fb show '+cls; f.innerHTML=html; gsap.from(f,{y:6,opacity:0,duration:.3}); }
let pending = [];
function later(s, fn){ pending.push(gsap.delayedCall(s, fn)); }
function resetScene(){ pending.splice(0).forEach(d=>d.kill()); cuePart=null; selPart=null; okParts.clear(); OKG.v=0; clearCallouts(); if(typeof beam==='function' && SCAN_U.uScanOn.value>0) beam(false); }

let currentState = ()=>{}, onStore = false;

/* ---- 1 · Diagnose: scan ----
   Rhythm: one GSAP timeline, a fixed 0.8 s beat per part.
   Panel: anime.js ring + counter. Model: the part being read pulses blue while the camera orbits to the back. */
/* every part of the 3D model, by where it sits. 'read' parts send a signal and get checked; the others are
   mechanical (no signal) and are shown hatched as "check visually". Names = the hover names in PARTS. */
const PMAP = {
  wheel:{n:'Wheel', read:['buttons','dpad','dials','paddles','leds','contact'], vis:['qr','hub','grips','body']},
  base: {n:'Base',  read:['motors','cables','board'], vis:['mounts','housing','cover','rear','clamp']},
};
const SCAN = ['buttons','dpad','dials','paddles','leds','motors','cables','board','contact'].map(k=>[PARTS[k].n, k]);   // contact ring is read last
const READABLE = new Set(SCAN.map(s=>s[1]));
const BEAT = .6;
function pmCard(k, mode){
  const g = PMAP[k], st = p => mode==='res' ? (p===faultPart ? 'bad' : 'ok') : 'wait';
  const bad = mode==='res' ? g.read.filter(p=>p===faultPart).length : 0;
  const right = mode==='res' ? `${bad?`<b class="red" style="font-weight:400">${bad} issue</b> · `:''}${g.read.length-bad} / ${g.read.length} normal`
                             : `${g.read.length} parts read · ${g.vis.length} structural`;
  return `<div class="pmc"><div class="t">${g.n}<span>${right}</span></div>
    <div class="cells">${g.read.map(p=>`<i class="cell ${st(p)}" data-p="${p}"></i>`).join('')}${g.vis.map(p=>`<i class="cell na" data-p="${p}"></i>`).join('')}</div>
    ${mode==='res' ? '' : `<div class="lbl">${g.read.map(p=>PARTS[p].n).join(' · ')}</div>`}</div>`;
}
// hovering a cell = hovering that part on the model (blue highlight + the same tooltip)
function pmHover(){
  $$('#pb .cell').forEach(c=>{
    c.onmouseenter = e=>{ hoverPart = c.dataset.p; showTip(c.dataset.p, e); };
    c.onmousemove  = e=>showTip(c.dataset.p, e);
    c.onmouseleave = ()=>{ hoverPart = null; tip.classList.remove('show'); };
  });
}
const scan = go(()=>{
  resetScene();
  const R = 34, CIRC = 2*Math.PI*R;
  render(`
    ${phase(0)}
    <div class="scanhead">
      <svg class="ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="${R}" class="bg"/><circle cx="40" cy="40" r="${R}" class="fg" id="arc" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/></svg>
      <div class="num"><b id="pct">0</b><span>%</span></div>
      <div><div class="h" id="stitle" style="margin:0">Reading signals</div><div class="eyebrow" id="ssub" style="margin-top:6px">Checked 0 / ${SCAN.length}</div></div>
    </div>
    <div style="margin-top:12px">${pmCard('wheel')}${pmCard('base')}</div>
    <div class="pmleg"><span style="--c:#4c8f6b">Normal</span><span style="--c:var(--blue)">Reading</span><span style="--c:#3a3c41">Waiting</span><span style="--c:repeating-linear-gradient(-45deg,#55585e 0 2px,transparent 2px 4px)">Not readable</span></div>
    <div class="pmtick" id="tick"></div>`);
  pmHover();
  const total = SCAN.length*BEAT + .3;
  const prog = {v:0};
  anime({targets:prog, v:100, duration:total*1000, easing:'linear', update:()=>{
    const a=$('#arc'), n=$('#pct'); if(!a) return;
    a.setAttribute('stroke-dashoffset', CIRC*(1-prog.v/100)); n.textContent = Math.round(prog.v); hudState('progress', prog.v/100);
  }});
  // camera: smooth orbit from the front to the back of the wheel
  const r0 = Math.hypot(camera.position.x, camera.position.z), a0 = Math.atan2(camera.position.x, camera.position.z);
  const orb = {a:a0, r:r0, y:camera.position.y};
  const back = VIEWS.back.p; let a1 = Math.atan2(back[0], back[2]); if(a1 < a0) a1 += Math.PI*2;
  gsap.to(controls.target,{x:VIEWS.back.t[0],y:VIEWS.back.t[1],z:VIEWS.back.t[2],duration:total,ease:'sine.inOut'});
  gsap.to(orb,{a:a1, r:Math.hypot(back[0],back[2]), y:back[1], duration:total, ease:'sine.inOut',
    onUpdate:()=>camera.position.set(Math.sin(orb.a)*orb.r, orb.y, Math.cos(orb.a)*orb.r)});
  const tl = gsap.timeline(), cellOf = p => $(`#pb .cell[data-p="${p}"]`), tick = $('#tick');
  let lastDone = '';
  pending.push(tl);
  const box = new THREE.Box3().setFromObject(product), top = box.max.y + .01, bot = box.min.y - .01;
  const sweep = {y:top}; beamAt(top); beam(true);
  tl.to(sweep,{y:bot, duration:total/2, ease:'sine.inOut', onUpdate:()=>beamAt(sweep.y)}, 0)
    .to(sweep,{y:top, duration:total/2, ease:'sine.inOut', onUpdate:()=>beamAt(sweep.y)}, total/2)
    .call(()=>beam(false), null, total);
  SCAN.forEach(([t,part],i)=>{
    const c = cellOf(part), at = i*BEAT, last = i===SCAN.length-1;
    tl.call(()=>{ c.className='cell run'; cuePart = part;
      $('#ssub').textContent = `Reading: ${t} · ${i+1} / ${SCAN.length}`;
      tick.innerHTML = `${lastDone}<div class="now">… ${t}</div>`; }, null, at);
    tl.call(()=>{
      cuePart = null;
      if(last){ c.className='cell bad'; faultPart='contact';
        $('#stitle').innerHTML = 'Found <span class="red">1</span> issue'; $('#arc').classList.add('bad'); hudState('fault');
        $('#ssub').textContent = `Checked ${SCAN.length} / ${SCAN.length}`;
        tick.innerHTML = `${lastDone}<div class="red">! ${t} · poor contact</div>`; }
      else { c.className='cell ok'; lastDone = `<div>✓ ${t} · normal</div>`; }
      gsap.fromTo(c,{scaleY:.5},{scaleY:1,duration:.35,ease:'back.out(3)'});
    }, null, at + BEAT*.75);
  });
  tl.call(()=>result(), null, total + .7);
});

  { t:'Fit the new contact ring', d:'Line it up with the locating notch and press the new contact ring all the way in. A click means it is seated.', tools:['New contact ring QR-C01'], img:'Locating notch aligned', v:'backNear', cue:null, co:['contact','Align the notch, press in'],
    set(){ collar.position.z = 0; collar.material.opacity = 1; fixedPart='contact'; },
    play(){ fixedPart='contact'; return gsap.timeline().fromTo(collar.position,{z:-.04},{z:0,duration:1,ease:'bounce.out'}).fromTo(collar.material,{opacity:0},{opacity:1,duration:.4},0); },
    ok:'New contact ring fitted.' },
  { t:'Refit the wheel', d:'Line it up with the quick release and push in. The lock ring springs back; pull gently to check it holds.', tools:['No tools needed'], img:'Wheel pushed into the quick release', v:'back', cue:'qr', co:['qr','Push into the quick release'],
    set(){ rig.position.z = 0; }, play(){ return gsap.timeline().to(rig.position,{z:0,duration:1.1,ease:'power3.inOut'}); }, ok:'Wheel refitted.' },
  { t:'Power on and test', d:'Reconnect power and test the buttons in G HUB.', tools:['G HUB'], img:'G HUB button test screen', v:'front', cue:null, co:null, test:true,
    set(){}, play(){
      // a light line runs over the whole set (checking); each part it reads ticks green in turn; then one green
      // pulse over everything (all good) that settles back, leaving only the new contact ring green
      const ORDER = ['contact','qr','hub','buttons','dpad','dials','paddles','leds','grips','body'];
      const box = new THREE.Box3().setFromObject(product), top = box.max.y + .01, bot = box.min.y - .01, sw = {y:top};
      okParts.clear(); OKG.v = .32;
      const t = gsap.timeline()
        .call(()=>{ beamAt(top); beam(true); }, null, 0)
        .to(sw, {y:bot, duration:2.6, ease:'sine.inOut', onUpdate:()=>beamAt(sw.y)}, 0)
        .call(()=>beam(false), null, 2.6)
        .call(()=>meter(0,6), null, .8)
        .call(()=>meter(6,12), null, 2.1);
      ORDER.forEach((part,i)=>t.call(()=>{ cuePart = part; okParts.add(part); }, null, .25 + i*.24));
      return t.call(()=>{ cuePart = null; }, null, 2.7)
        .to(OKG, {v:.75, duration:.25, ease:'power2.out'}, 2.8)
        .to(OKG, {v:0, duration:.9, ease:'power2.in'}, 3.15)
        .call(()=>okParts.clear(), null, 4.05);
    }, ok:'No disconnects through the full rotation.' },
];
function meter(a,b){ $$('#meter i').forEach((m,k)=>{ if(k>=a&&k<b) setTimeout(()=>{ m.classList.add('on'); m.style.height=(70+((k*37)%30))+'%'; },(k-a)*80); }); }
function repairScene(i){
  gsap.killTweensOf([rig.position, collar.position, collar.material, rig.rotation]);
  rig.position.z = 0; collar.position.z = 0; collar.material.opacity = 1; rig.rotation.z = 0;
  fixedPart = null; faultPart = 'contact';
  for(let k=0;k<i;k++) STEPS[k].set();
  if(fixedPart) faultPart = null;
}
let tl = null;
const repair = go(i=>{
  const s = STEPS[i]; resetScene(); if(tl) tl.kill();
  repairScene(i); view(s.v, 1.2); hudState('idle');
  render(`
    ${phase(1)}
    <div class="eyebrow">Repair · Step ${i+1} of ${STEPS.length}</div>
    <div class="h">${s.t}</div>
    <p class="desc">${s.d}</p>
    <div class="tools">${s.tools.map(t=>`<span>${t}</span>`).join('')}</div>
    ${s.pic ? PIC(s.pic, s.img) : IMG(s.img)}
    ${s.test?`<div class="meter" id="meter">${'<i></i>'.repeat(12)}</div>`:''}
    <div class="fb" id="fb"></div>`,
  `<button class="btn" id="done">${CHECK}<span>${s.test?'Start test':'Step done'}</span></button>
   <div class="note"><button id="replay">↻ Replay animation</button>${i>0?' · <button id="prev">Previous step</button>':''}</div>`);
  later(1, ()=>{ cuePart = s.cue; if(s.co) callout(s.co[0], s.co[1], '#1199ff', 250, -185); });
  if(!s.test) later(1.8, ()=>{ tl = s.play(); });
  $('#replay').onclick = ()=>repair(i);
  if($('#prev')) $('#prev').onclick = ()=>repair(i-1);
  $('#done').onclick = e=>{
    const b = e.currentTarget; if(b.classList.contains('ok') || b.disabled) return;
    const finish = ()=>{
      b.disabled = false; b.classList.add('ok'); b.querySelector('span').textContent = 'Done'; cuePart = null;
      later(1, ()=> i===STEPS.length-1 ? done() : repair(i+1));
    };
    if(s.test){ b.disabled = true; b.querySelector('span').textContent = 'Testing…'; tl = s.play(); tl.eventCallback('onComplete', finish); }
    else finish();
  };
});

/* ---- Done ---- */
const done = go(()=>{
  resetScene(); faultPart=null; fixedPart='contact'; view('front'); hudState('fixed');
  render(`
    ${phase(2)}
    <div class="yay">
      <div class="badge" id="badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div class="h" style="margin-top:20px">All fixed!</div>
      <p class="desc">Your wheel is ready for the track again 🏁</p>
    </div>`,
  `<button class="btn" id="fin">Claim your reward →</button>`);
  $('#fin').onclick = medal;
  celebrate();
});
function celebrate(){
  // badge pops in, the check draws, confetti bursts out of it, the wheel does a little happy spin
  anime({targets:'#badge', scale:[0,1], rotate:[-25,0], duration:900, delay:250, easing:'easeOutElastic(1, .55)'});
  anime({targets:'#badge path', strokeDashoffset:[anime.setDashoffset,0], duration:450, delay:650, easing:'easeOutQuad'});
  burst($('.yay'), $('#badge'), 600);
  gsap.fromTo(product.rotation,{y:0},{y:Math.PI*2, duration:1.6, delay:.5, ease:'power3.inOut'});
}
function burst(host, b, delay){
  if(!host || !b) return;
  const COLS = ['#1199ff','#3ddc84','#ffb020','#ff4545','#b050ff','#ffffff'];
  setTimeout(()=>{
    for(let i=0;i<36;i++){
      const c = document.createElement('i'); c.className = 'cf';
      c.style.background = COLS[i%COLS.length];
      if(i%3===0) c.style.borderRadius = '50%';
      c.style.left = (b.offsetLeft + b.offsetWidth/2) + 'px'; c.style.top = (b.offsetTop + b.offsetHeight/2) + 'px';
      host.appendChild(c);
      const a = Math.random()*Math.PI*2, d = 70 + Math.random()*90;
      anime({targets:c, translateX:Math.cos(a)*d, translateY:[0, Math.sin(a)*d*.8 + 60], rotate:anime.random(-360,360),
        opacity:[{value:1,duration:50},{value:0,delay:700,duration:400}], duration:1300, easing:'easeOutCubic', complete:()=>c.remove()});
    }
  }, delay);
}

/* =========================================================
   MEDALS — flat sticker medals: pit-sign / race-decal style, site colours, cream die-cut edge, hard shadow
   ========================================================= */
const STK = (()=>{
  const B='#1199ff', GR='#3ddc84', AM='#ffb020', CR='#ece8df', INK='#16171b', LK='#45484e';
  const SH='<filter id="stk-sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="0" flood-color="#000" flood-opacity=".45"/></filter>';
  const cut = sh=>`<g filter="url(#stk-sh)" fill="${CR}" stroke="${CR}" stroke-width="14" stroke-linejoin="round">${sh}</g>`;
  const svg = (inner, z, rot=0)=>`<svg class="stk" width="${z}" height="${z}" viewBox="0 0 200 200" style="transform:rotate(${rot}deg)"><defs>${SH}</defs>${inner}</svg>`;
  const T = (x,y,sz,t,f=INK,a='middle')=>`<text class="tx" x="${x}" y="${y}" font-size="${sz}" fill="${f}" text-anchor="${a}"${a==='start'?' font-style="italic"':''}>${t}</text>`;
  const DIA='<rect x="42" y="42" width="116" height="116" rx="14" transform="rotate(45 100 100)"/>', PLATE='<rect x="14" y="44" width="172" height="112" rx="12"/>',
        ROUND='<circle cx="100" cy="100" r="66"/>', SLANT='<path d="M40 56h150l-30 88H10z"/>', SHIELD='<path d="M30 40h140v86l-70 40-70-40z"/>';
  return {
    DIA, PLATE, ROUND, SHIELD,
    first:(z,r=-4)=>svg(cut(DIA)+`<g fill="${AM}">${DIA}</g>
      <rect x="52" y="52" width="96" height="96" rx="8" transform="rotate(45 100 100)" fill="none" stroke="${INK}" stroke-width="5"/>
      <path d="M88 70v60" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><path d="M92 70h34l-8 12 8 12H92z" fill="${INK}"/>`, z, r),
    qr:(z,r=0)=>svg(cut(SLANT)+`<g fill="${B}">${SLANT}</g>
      <path d="M30 120h52M38 132h36" stroke="${CR}" stroke-width="5" stroke-linecap="round" opacity=".6"/>
      <circle cx="62" cy="92" r="20" fill="none" stroke="${CR}" stroke-width="8"/><circle cx="62" cy="92" r="6" fill="${CR}"/>
      ${T(98,96,25,'QUICK',CR,'start')}${T(94,122,25,'HANDS',INK,'start')}`, z, r),
    three:(z,r=4)=>svg(cut(SHIELD)+`<g fill="${GR}">${SHIELD}</g>
      ${Array.from({length:14},(_,i)=>`<rect x="${30+i*10}" y="40" width="10" height="10" fill="${i%2?INK:CR}"/><rect x="${30+i*10}" y="50" width="10" height="10" fill="${i%2?CR:INK}"/>`).join('')}
      ${[0,1,2].map(i=>`<path d="M68 ${78+i*20} l32 16 32-16" fill="none" stroke="${INK}" stroke-width="9"/>`).join('')}`, z, r),
    // a medal not earned yet: dashed outline of its sign shape
    lock:(sh,z)=>svg(`<g fill="none" stroke="${LK}" stroke-width="5" stroke-dasharray="10 9">${sh}</g>${T(100,116,40,'?',LK)}`, z),
    // a repair that earned no medal: plain grey part sign (grips)
    grips:z=>svg(`<circle cx="100" cy="100" r="66" fill="#2f3136"/><rect x="74" y="62" width="18" height="76" rx="9" fill="#8a8d93"/><rect x="108" y="62" width="18" height="76" rx="9" fill="#8a8d93"/>`, z),
  };
})();

/* ---- Medal unlocked (after the repair is finished) ---- */
let earned = false, freshWall = false;   // set when this repair is finished: Hat trick + the new log entry appear in My garage
const medal = go(()=>{
  resetScene(); view('front');
  if(!earned){ earned = true; freshWall = true; }
  render(`
    <div class="medal">
      <div class="glow" id="mdl">${STK.three(140,-6)}</div>
      <div class="tag">New medal</div>
      <div class="h">Hat trick</div>
      <p class="desc">Your third repair, done by yourself</p>
      <div class="wall"><span>${STK.first(28,0)}${STK.qr(28,0)}<span class="slot" id="slot"><i></i></span></span>+1 on your wall · 3 of 12</div>
    </div>`,
  `<button class="btn go" id="towall">View medal wall</button><button class="btn sub" id="race">All fixed! Back to racing</button>`);
  $('#race').onclick = start;
  $('#towall').onclick = ()=>setTab('garage');
  // the sticker slaps on, confetti bursts out of it, then a small copy drops into the empty slot on the wall
  anime({targets:'#mdl', scale:[0,1], rotate:[-25,0], duration:900, delay:200, easing:'easeOutElastic(1, .55)'});
  burst($('.medal'), $('#mdl'), 450);
  later(1.5, ()=>{ const sl = $('#slot'); if(!sl) return; sl.innerHTML = STK.three(28,0);
    anime({targets:'#slot', scale:[0,1], duration:600, easing:'easeOutElastic(1, .6)'}); });
});

/* =========================================================
   MY GARAGE — repair log + medal wall
   ========================================================= */
const MEDALS = [
  {n:'First fix',    how:'Finish your first repair', svg:z=>STK.first(z)},
  {n:'Quick hands',  how:'Fix the quick release',    svg:z=>STK.qr(z)},
  {n:'Hat trick',    how:'3 repairs done',           svg:z=>STK.three(z), shape:STK.SHIELD, isNew:true},
  {n:'Ring master',  how:'Replace a contact ring',   lock:STK.ROUND},
  {n:'Under 10 min', how:'A repair in under 10 min', lock:STK.DIA},
  {n:'Paddle swap',  how:'Replace a shift paddle',   lock:STK.PLATE},
  {n:'High five',    how:'5 repairs done',           lock:STK.ROUND},
  {n:'Fresh grips',  how:'Replace the grips',        lock:STK.DIA},
];
const REPAIRS = [
  {ic:z=>STK.qr(z,0),    a:'Quick release',    b:'Contact ring replaced · 12 min', d:'Nov 19', isNew:true},
  {ic:z=>STK.first(z,0), a:'Shift paddle (R)', b:'Replaced · 9 min',               d:'Sep 21'},
];
function garage(){
  const locked = m => m.lock || (m.isNew && !earned), log = REPAIRS.filter(r=>!r.isNew || earned);
  const got = MEDALS.filter(m=>!locked(m)).length, fresh = freshWall; freshWall = false;
  pb.innerHTML = `
    <div class="gstats"><div class="gstat"><b>${earned ? 3 : 2}</b><span>Repairs</span></div><div class="gstat"><b>${got}<small>/12</small></b><span>Medals</span></div></div>
    <div class="gsec">Medal wall</div>
    <div class="mgrid">${MEDALS.map(m=>`<div class="mcell ${locked(m)?'lock':''} ${fresh&&m.isNew?'fresh':''}" title="${m.how}"><span class="pop">${locked(m)?STK.lock(m.lock||m.shape,60):m.svg(60)}</span>${m.n}</div>`).join('')}</div>
    <div class="gsec">Repair log<small>View all</small></div>
    <div style="margin-top:2px">${log.map(r=>`<div class="glog ${fresh&&r.isNew?'fresh':''}">${r.ic(38)}<div class="t"><div>${r.a}</div><div>${r.b}</div></div><div class="d">${r.d}</div></div>`).join('')}</div>`;
  pf.innerHTML = '';
  // the earned stickers slap onto the wall one after another
  anime({targets:'.mcell:not(.lock) .pop', scale:[.4,1], rotate:[-12,0], opacity:[0,1], duration:700, delay:anime.stagger(90,{start:200}), easing:'easeOutElastic(1, .6)'});
}

/* =========================================================
   STORE
   ========================================================= */
const ITEMS = [
  {id:'qr',  nm:'Quick-release contact ring', sku:'QR-C01', price:12.90, need:true},
];
const cart = {};
function store(){
  const n = Object.keys(cart).length, total = Object.keys(cart).reduce((s,id)=>s+ITEMS.find(x=>x.id===id).price,0);
  $('#cnt').textContent = n; $('#cnt').classList.toggle('show', n>0);
  pb.innerHTML = `
    <div class="eyebrow">${diagnosed?'Recommended for this diagnosis':'Common spare parts'}</div>
    ${ITEMS.map(it=>`<div class="item"><span class="th"></span>
      <div><div class="nm">${it.nm}${it.need&&diagnosed?'<span class="need">Needed now</span>':''}</div><small>${it.sku}</small></div>
      <div class="pr">€ ${it.price.toFixed(2)}<div><button class="add ${cart[it.id]?'in':''}" data-id="${it.id}">${cart[it.id]?'✓ Added':'+ Add to cart'}</button></div></div></div>`).join('')}
`;
  pf.innerHTML = `<div class="row" style="border:0;padding-top:0"><span>Total · ${n} ${n===1?'item':'items'}</span><b style="font-size:18px">€ ${total.toFixed(2)}</b></div>
    <button class="btn" id="pay" ${n?'':'disabled'}>Checkout</button>
    ${diagnosed?'<div class="note"><button id="backflow">← Back to repair</button></div>':''}`;
  $$('.add').forEach(b=>b.onclick=()=>{ const id=b.dataset.id, add=!cart[id]; add?cart[id]=1:delete cart[id]; store(); toast(add?'Added to cart':'Removed from cart'); });
  $('#pay').onclick = ()=>toast('Prototype demo: checkout is not implemented yet');
  if($('#backflow')) $('#backflow').onclick = ()=>setTab('flow');
}

ready.then(start);
</script>
</body>
